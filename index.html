<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ХОЛОС: ЯДРО 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:flex-start;justify-content:center}
  canvas{display:block;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;
    image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  @supports (height:100dvh){canvas{width:min(100vw,calc(100dvh*16/9))}}
  @media (orientation:landscape){body{align-items:center}}
  /* Экранные кнопки (показываются только на сенсорных устройствах — решает скрипт, класс .on).
     Крупные плоские круги со стрелкой, без рамок и подписей. Нажатия ловит скрипт по координатам
     (зона шире кнопки), сами кнопки только рисуются. */
  #pad{display:none;position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));
    padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));
    justify-content:space-between;align-items:flex-end;pointer-events:none}
  #pad.on{display:flex}
  #pad[data-mode="none"]{display:none}
  #pad button.dn{display:none}
  #pad[data-mode="swim"] button.dn{display:flex}
  #pad div{display:flex;align-items:flex-end;gap:clamp(14px,4vmin,28px)}
  #pad button{pointer-events:none;display:flex;align-items:center;justify-content:center;padding:0;border:0;
    width:clamp(84px,25vmin,136px);height:clamp(84px,25vmin,136px);border-radius:50%;
    background:#ffffff30;color:#ffffffd0;touch-action:none;-webkit-tap-highlight-color:transparent}
  #pad button.act{background:#ffffff70;color:#fff}
  #pad button.j{width:clamp(108px,33vmin,176px);height:clamp(108px,33vmin,176px)}
  #pad button svg{width:44%;height:44%;fill:currentColor}
  #fs{position:fixed;z-index:5;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);
    width:34px;height:34px;padding:6px;box-sizing:border-box;border-radius:8px;border:2px solid #fff6;
    background:#00000066;color:#fff;opacity:.6;cursor:pointer;touch-action:manipulation}
  #fs:hover,#fs:active{opacity:1}
  #fs svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square}
  #fs .x{display:none} #fs.on .e{display:none} #fs.on .x{display:block}
  #fs[hidden]{display:none}
  @media (orientation:portrait){#fs{top:calc(min(100vw,100vh*16/9)*9/16 + 8px)}}
  .fontload{font-family:"Press Start 2P";position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fs" tabindex="-1" aria-label="Полный экран" title="Полный экран (F)">
  <svg class="e" viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg>
  <svg class="x" viewBox="0 0 20 20"><path d="M7 2v5H2M18 7h-5V2M13 18v-5h5M2 13h5v5"/></svg>
</button>
<div class="fontload">Хх</div>
<div id="pad">
  <div>
    <button data-k="left" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M17 3L5 12l12 9z"/></svg></button>
    <button data-k="right" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="M7 3l12 9L7 21z"/></svg></button>
  </div>
  <div>
    <button class="dn" data-k="down" aria-label="Вниз"><svg viewBox="0 0 24 24"><path d="M3 7l9 12 9-12z"/></svg></button>
    <button class="j" data-k="jump" aria-label="Прыжок"><svg viewBox="0 0 24 24"><path d="M3 17l9-12 9 12z"/></svg></button>
  </div>
</div>
<script src="sprites.js"></script>
<script src="game.js"></script>
<script src="editor.js"></script>
</body>
</html>
